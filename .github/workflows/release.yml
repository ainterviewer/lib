name: release
on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*rc*"
  # A manual run from a branch publishes a preview worker image of it.
  workflow_dispatch:
    inputs:
      label:
        description: "Preview label, as in 0.9-<label> (default: the branch name)"
        required: false
  # Pull requests run the test job only: the worker and build-artifacts jobs
  # below require a version tag ref or a manual run, which a PR event never is.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync environment
        run: uv sync --locked --all-extras --dev

      - name: Run pre-commit hooks
        run: uv run prek run --all-files

      - run: uv run pytest -q

      - name: Minimize uv cache
        run: uv cache prune --ci

  worker:
    # The runtime server image, ghcr.io/ainterviewer/worker. Which tags a build
    # may move is decided by the Classify step alone.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      # - a final tag vX.Y.Z publishes X.Y.Z and moves X.Y, the image every
      #   project on runtime version X.Y runs;
      # - any other tag (vX.Y.ZrcN, and uv's alpha and beta bumps) publishes
      #   itself and moves X.Y-rc, never X.Y, as the preview "X.Y-rc";
      # - a manual run publishes sha-<short> only, as the preview
      #   "X.Y-<label>", for a backend to pin.
      # The worker checks the preview name against its own version at start.
      - name: Classify the ref
        id: release
        env:
          LABEL: ${{ inputs.label || github.ref_name }}
        run: |
          set -euo pipefail
          image=ghcr.io/${{ github.repository_owner }}/worker
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          release=$(echo "$version" | cut -d. -f1,2)
          sha=$(git rev-parse --short HEAD)

          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            label=$(echo "$LABEL" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')
            if [[ -z "$label" ]]; then
              echo "No preview label in '$LABEL'" >&2
              exit 1
            fi
            runtime="$release-$label"
            tags="$image:sha-$sha"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            runtime=""
            tags="$image:$version,$image:$release"
          else
            runtime="$release-rc"
            tags="$image:$version,$image:$release-rc"
          fi

          # A tag must name the version it was cut from.
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $version" >&2
            exit 1
          fi

          {
            echo "runtime=$runtime"
            echo "expected=${runtime:-$release}"
            echo "build=$sha"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"
          echo "Runtime version: ${runtime:-$release}; tags: $tags" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ steps.release.outputs.tags }}
          build-args: |
            RUNTIME_VERSION=${{ steps.release.outputs.runtime }}
            WORKER_BUILD=${{ steps.release.outputs.build }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      # The image must start, and say it is the runtime version it is
      # published as, before any tag moves.
      - name: Smoke test
        env:
          TAGS: ${{ steps.release.outputs.tags }}
          EXPECTED: ${{ steps.release.outputs.expected }}
        run: |
          set -euo pipefail
          docker run -d --name worker -p 8700:8700 "${TAGS%%,*}"
          for _ in $(seq 30); do
            curl -fsS http://127.0.0.1:8700/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8700/version | tee version.json
          actual=$(jq -r .runtime_version version.json)
          if [[ "$actual" != "$EXPECTED" ]]; then
            docker logs worker
            echo "Image reports $actual, expected $EXPECTED" >&2
            exit 1
          fi

      - name: Push
        env:
          TAGS: ${{ steps.release.outputs.tags }}
        run: |
          for tag in ${TAGS//,/ }; do
            docker push "$tag"
          done

  build-artifacts:
    runs-on: ubuntu-latest
    # A release is published only once its worker image is.
    needs: worker
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      # Full history + tags: git-cliff diffs this tag against the previous one.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv build

      - name: Generate release notes
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.13.1
          args: --latest --strip header

      - uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ steps.cliff.outputs.changelog }}
          files: |
            dist/*.whl
            dist/*.tar.gz
          prerelease: ${{ contains(github.ref, 'rc') }}
