[project]
name = "ainterviewer"
version = "0.3.5"
description = "Python framework for creating automated interviews with the use of LLMs"
readme = "README.md"
authors = [{ name = "Tobias Gårdhus", email = "tpg@sodas.ku.dk" }]
requires-python = ">=3.12.0"
license = "AGPL-3.0-only"
license_files = ["LICENSE"]

dependencies = [
  "any-llm-sdk[gemini,openai,openrouter,vllm]>=1.13.0",
  "jinja2>=3.1.6",
  "polars>=1.35.2",
  "pyarrow>=22.0.0",
  "pydantic-extra-types>=2.10.4",
  "pydantic-settings>=2.7.1",
  "pydantic>=2.9,<3",
  "pyyaml>=6.0.2",
  "requests>=2.32.5",
  "structlog>=25.3.0",
  "typer>=0.20.0",
]

[project.optional-dependencies]
analysis = [
  "adbc-driver-sqlite>=1.6.0",
  "ipykernel>=6.29.5",
  "pyarrow>=20.0.0",
  "rich>=14.0.0",
  "ua-parser[regex]>=1.0.1",
  "umap-learn>=0.5.9.post2",
  "user-agents>=2.2.0",
]

[dependency-groups]
dev = [
  "deptry>=0.23.0",
  "djlint>=1.36.4",
  "inquirer>=3.4.0",
  "ipykernel>=6.29.5",
  "prek>=0.4.4",
  "psycopg2-binary>=2.9.10",
  "pytest>=8.4.0",
  "ruff>=0.15",
  "ty>=0.0.41",
]

[tool.djlint]
profile = "jinja"
indent = 4

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["RUF022"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
