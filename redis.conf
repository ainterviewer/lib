# Data directory
dir ./cache/redis/

# RDB persistence (snapshots)
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb

# AOF persistence (write-ahead log)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec  

# Other useful settings
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
loglevel warning
